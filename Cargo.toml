[workspace]
members = ["crates/app", "crates/core", "crates/dsp", "crates/host-test", "crates/oracle", "crates/plugin", "crates/plugin-nice", "crates/ui"]
resolver = "3"

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.98"
license = "MIT"

[workspace.dependencies]
ronie-core = { version = "0.1.1", path = "crates/core" }
ronie-dsp = { version = "0.1.1", path = "crates/dsp" }
ronie-oracle = { version = "0.1.1", path = "crates/oracle" }
ronie-plugin = { version = "0.1.1", path = "crates/plugin" }
ronie-ui = { version = "0.1.1", path = "crates/ui" }
accesskit = "0.25.2"
base64 = "0.23.1"
cap-std = "4.0.3"
clap = { version = "4.5.53", features = ["derive"] }
criterion = "0.5.1"
cpal = { version = "0.18.2", features = ["realtime"] }
eframe = { version = "0.37.0", default-features = false, features = ["accesskit", "clipboard", "glow", "links", "x11"] }
egui = { version = "0.37.0", default-features = false }
eyre = "0.6.12"
fs2 = "0.4.3"
futures-util = "0.3.34"
getrandom = "0.4.3"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
midir = "0.11.1"
nice-plug = "0.4.2"
nice-plug-egui = "0.6.0"
percent-encoding = "2.3.2"
proptest = "1.9.0"
quick-xml = "0.42.0"
qrcode = "0.14.1"
raw-window-handle = "0.6.2"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "query", "stream", "gzip"] }
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal"] }
secrecy = "0.10.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.11.1"
tempfile = "3.27.0"
thiserror = "2.0.17"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "sync", "time", "net", "io-util", "fs"] }
url = { version = "2.5.8", features = ["serde"] }
x11rb = { version = "0.13.2", default-features = false, features = ["resource_manager"] }
winit = { version = "0.30.13", default-features = false, features = ["x11"] }

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
unreachable_pub = "warn"
unused_crate_dependencies = "allow"
unused_must_use = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }

[workspace.lints.clippy]
all = "warn"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
