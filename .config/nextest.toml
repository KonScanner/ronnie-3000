# cargo-nextest runs each test in its own process, and many tests at the same time.

# These tests measure time. Other tests on the same machine slow them down, so each one runs with
# no other test. A test that fails and then passes on the second try shows as FLAKY in the summary.
[[profile.default.overrides]]
filter = 'binary(pitch_allocation) | binary(live_signal)'
threads-required = "num-test-threads"
retries = 1

# CI runs on shared machines, and many tests here compare wall-clock time with a limit. In CI, a
# failed test runs one more time. A test that fails two times still fails the run.
[profile.ci]
retries = 1
fail-fast = false
