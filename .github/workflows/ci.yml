name: CI

# CI skips a change that touches only these files, because no build, test, or bundle step uses them.
on:
  push:
    branches: [main]
    paths-ignore: &docs-only
      - '**.md'
      - LICENSE
      - Makefile
      - install.sh
      - assets/screenshots/**
      - packaging/linux/**
      - packaging/ronnie-3000.desktop
      - .github/CODEOWNERS
      - .github/ISSUE_TEMPLATE/**
      - .gitignore
  pull_request:
    paths-ignore: *docs-only
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  NEXTEST_PROFILE: ci

jobs:
  check:
    name: Check (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev pkg-config xvfb
      - name: Install Rust from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Only main saves the cache. A pull request uses the cache of main.
          save-if: ${{ github.ref == 'refs/heads/main' }}
          # The cache key comes from the dependencies, not from the cargo profiles. Change this
          # value when [profile.ci] in Cargo.toml changes, so that main saves a new cache.
          key: profile-ci-1
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-deny,cargo-nextest
      - name: Build, lint, test, format, and dependency check
        run: make check
      - name: Bundle the VST3 plugin
        env:
          VERSION: ci
          PLATFORM: linux-x86_64
          LIBRARY: target/ci/libronie_plugin_nice.so
        run: |
          cargo build --locked --profile ci -p ronie-plugin-nice
          DIST_DIR=target/ci-dist bash packaging/vst3/bundle.sh
      - name: Check the VST3 plugin with pluginval
        run: bash script/pluginval.sh "target/vst3-bundle/ronnie-3000-vst3-ci-linux-x86_64/Ronnie 3000.vst3"

  build:
    name: Build and test (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            platform: macos-arm64
            library: target/ci/libronie_plugin_nice.dylib
          - name: Windows
            os: windows-2025
            platform: windows-x86_64
            library: target/ci/ronie_plugin_nice.dll
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Only main saves the cache. A pull request uses the cache of main.
          save-if: ${{ github.ref == 'refs/heads/main' }}
          # The cache key comes from the dependencies, not from the cargo profiles. Change this
          # value when [profile.ci] in Cargo.toml changes, so that main saves a new cache.
          key: profile-ci-1
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-nextest
      - name: Test
        # In bash, a failed first command stops the step. PowerShell would go on to the next.
        shell: bash
        run: |
          cargo nextest run --workspace --locked --no-fail-fast --cargo-profile ci
          cargo test --workspace --locked --doc --profile ci
      - name: Bundle the VST3 plugin
        shell: bash
        env:
          VERSION: ci
          PLATFORM: ${{ matrix.platform }}
          LIBRARY: ${{ matrix.library }}
        run: |
          cargo build --locked --profile ci -p ronie-plugin-nice
          DIST_DIR=target/ci-dist bash packaging/vst3/bundle.sh
      - name: Check the VST3 plugin with pluginval
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
        run: bash script/pluginval.sh "target/vst3-bundle/ronnie-3000-vst3-ci-$PLATFORM/Ronnie 3000.vst3"
