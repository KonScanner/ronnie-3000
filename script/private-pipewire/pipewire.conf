# A private PipeWire server for tests. It has fake nodes only: no ALSA, no session manager, and no
# device monitor, so that it cannot touch real hardware.
context.properties = {
    core.daemon = true
    core.name = pipewire-0
    support.dbus = false
    log.level = 2
    default.clock.rate = 48000
    default.clock.allowed-rates = [ 48000 ]
    default.clock.quantum = 256
    default.clock.min-quantum = 32
    default.clock.max-quantum = 2048
}

context.spa-libs = {
    audio.convert.* = audioconvert/libspa-audioconvert
    support.*       = support/libspa-support
}

context.modules = [
    { name = libpipewire-module-rt
        args = {
            nice.level = -11
            rt.prio = 83
            rlimits.enabled = true
            rtportal.enabled = false
            rtkit.enabled = false
        }
        flags = [ ifexists nofail ]
    }
    { name = libpipewire-module-protocol-native }
    { name = libpipewire-module-metadata }
    { name = libpipewire-module-spa-node-factory }
    { name = libpipewire-module-client-node }
    { name = libpipewire-module-adapter }
    { name = libpipewire-module-link-factory }
    { name = libpipewire-module-access
        args = { access.socket = { pipewire-0 = unrestricted } }
    }
    # A virtual source, with a sink beside it where a test plays the signal of the "guitar".
    { name = libpipewire-module-loopback
        args = {
            node.description = "Fake Interface Input 1 Inst/Line"
            capture.props = {
                node.name      = fake_guitar_feed
                node.group     = fake.group
                media.class    = Audio/Sink
                audio.position = [ MONO ]
                node.autoconnect = false
            }
            playback.props = {
                node.name      = fake_guitar_input
                node.group     = fake.group
                media.class    = Audio/Source
                audio.position = [ MONO ]
                node.autoconnect = false
            }
        }
    }
    { name = libpipewire-module-loopback
        args = {
            node.description = "Fake Webcam Microphone"
            capture.props = {
                node.name      = fake_webcam_feed
                node.group     = fake.group
                media.class    = Audio/Sink
                audio.position = [ FL FR ]
                node.autoconnect = false
            }
            playback.props = {
                node.name      = fake_webcam
                node.group     = fake.group
                media.class    = Audio/Source
                audio.position = [ FL FR ]
                node.autoconnect = false
            }
        }
    }
]

context.objects = [
    { factory = metadata
        args = { metadata.name = default }
    }
    { factory = spa-node-factory
        args = {
            factory.name    = support.node.driver
            node.name       = fake_driver
            node.group      = fake.group
            priority.driver = 20000
        }
    }
    { factory = adapter
        args = {
            factory.name     = support.null-audio-sink
            node.name        = fake_headphones
            node.description = "Fake Interface Headphones"
            media.class      = Audio/Sink
            node.group       = fake.group
            audio.position   = [ FL FR ]
            audio.rate       = 48000
            monitor.channel-volumes = true
        }
    }
]
